
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>زيادة مشاهدات تيكتوك</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>زيادة مشاهدات تيكتوك</h1>
    <p>ادخل رابط الفيديو وعدد المشاهدات المطلوبة</p>

    <form id="viewForm">
      <input type="text" placeholder="رابط فيديو التيكتوك" required>
      <input type="number" placeholder="عدد المشاهدات" required>
      <button type="submit">ابدأ الآن</button>
    </form>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
      <span id="progressText">0%</span>
    </div>

    <div class="success-banner" id="successBanner">تم إضافة المشاهدات بنجاح!</div>

    <p class="note">خدمة مجانية وآمنة 100%</p>
  </div>

  <script>
    const form = document.getElementById('viewForm');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const successBanner = document.getElementById('successBanner');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const inputs = form.querySelectorAll('input');
      const link = inputs[0].value;
      const count = inputs[1].value;

      progressContainer.style.display = 'block';
      successBanner.style.display = 'none';
      let percent = 0;

      const interval = setInterval(() => {
        percent++;
        progressBar.style.width = percent + '%';
        progressText.innerText = percent + '%';

        if (percent >= 100) {
          clearInterval(interval);
          fetch('/sendViews', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ link, count })
          })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              successBanner.innerText = 'تمت إضافة المشاهدات بنجاح!';
            } else {
              successBanner.innerText = 'حدث خطأ: ' + data.message;
            }
            successBanner.style.display = 'block';
          });
        }
      }, 50);
    });
  </script>
</body>
</html>
